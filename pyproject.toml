[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-assist"
version = "0.1.0"
description = "Local-first AI dev copilot for your codebase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"typer>=0.12.3",
	"chromadb>=0.5.7",
	"langchain-chroma>=0.1.4",
	"langchain-core>=0.3.2",
	"langchain-ollama>=0.1.4",
	"langchain-text-splitters>=0.2.2",
	"langgraph>=0.3.2",
]

[project.scripts]
code-assist = "code_assist.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/code_assist"]
